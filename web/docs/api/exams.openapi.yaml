openapi: 3.1.0
info:
  title: Edra exams API (staff)
  version: "1.0.0"
  description: |
    Bearer-token reads for signed-in Edra staff (owner, head_admin, admin, instructor): list exams,
    read one exam (including its key), and read its students' work and result state. It shares
    authentication, response, throttling and CORS conventions with `sessions-attendance.openapi.yaml`;
    only what differs is stated here.

    **Operational now (source-checked 2026-10-14).** The three `GET` paths below. Staff commands
    (preparation, window, archive, physical entry and confirmation, private marks, announcement, key
    corrections and exclusions) are cookie web actions over the same database operations; they are not
    part of this HTTP contract.

    **Student database contract (EDRA-83 handoff).** Trusted public wrappers derive the caller's
    connected academy/year record through the shared ordinary-session resolver. Standalone exams
    need no content release. Before an own online attempt starts or solutions qualify, state returns
    empty question parts; physical drafts/submissions alone do not reveal material. Reads never start
    or extend an attempt. Student answering uses cookie web actions with EDRA-234 fullscreen/departure integration. A bounded cookie-only teardown POST is described below; hosted readiness remains unverified. A client-supplied
    annual record id or phone is never ownership. Source behavior is not a deployment assertion.

    **Rules.** An exam has ordered Question Sheet (choices, one correct, scored automatically) and
    Written Work (staff-marked) parts; Answer Sheet parts do not exist. Every exam needs an individual
    timer (`time_limit_minutes`) before it is ready: an incomplete draft may omit it, but scheduling,
    physical work and online starts require it. Scores are decimal **strings** with at most two
    fractional digits; unsupported precision is rejected, never rounded. A blank manual mark is
    unmarked; `"0"` is a mark. Eligibility is live: the students currently matching the target, plus
    every historical participant in the student list.

    **Timing.** `opens_at <= server_now < closes_at` allows a new online attempt. `actual_closes_at` is
    always `closes_at + 2 minutes`. A started attempt continues until the earlier of its original
    `deadline_at` (`started_at + time_limit_minutes`, never reset or extended) and `actual_closes_at`;
    at that cutoff its saved answers are submitted (`timer` when the deadline is at or before actual
    closure, a tie included, otherwise `window_closed`). `submitted_at` is the effective time;
    `processed_at` when the database settled it. A database worker settles deadlines every 30 seconds
    and every detail read and command settles due work first. Physical drafts and confirmation work
    once the exam is ready (also before opening or without a window) and stop at actual closure.
    Nothing reopens after actual closure.

    **Departures.** Each logical departure (stable event uuid per attempt, with the question the
    student was on) is stored once. The first two warn and return the next non-excluded question
    (none after the last); the third submits the saved answers with reason `kicked`, an explanatory
    flag graded normally, never a zero. A due timer or closure is settled first and wins.

    **Acceptance.** Online and physical drafts may coexist; the first online final submission or
    physical confirmation is the single accepted submission (`submission.source`). The other draft is
    kept as history and never merged.

    **Results.** `result` is the private current result (staff only). `publication` is the latest
    official revision; `publication_state` is `pending_correction` when the private result differs
    from it (for example after a key correction or exclusion). Fully automatic online work (including
    `timer`, `kicked` and `window_closed`) is announced in its acceptance transaction; everything else
    is announced by staff.

    **Not in this delivery.** Document/photo evidence, answer-document assets, file storage and
    solution videos are deferred: written answers are text and physical written work is marked by
    hand. Solution release covers the key, model answers and solution notes. Recording a
    `solutions_qualified` effect is not video access or parent delivery.
servers:
  - url: http://app.lvh.me:3000
    description: Local development (the staff origin; requires the lvh.me host, not localhost)
  - url: "{staffOrigin}"
    description: Deployed staff origin (the value of EDRA_APP_ORIGIN)
    variables:
      staffOrigin:
        default: https://app.example.invalid
security:
  - staffToken: []
tags:
  - name: Exams
paths:
  /api/v1/academies/{academyId}/exams:
    get:
      tags: [Exams]
      summary: The academy's exams, newest first, with derived phase
      operationId: listExams
      parameters:
        - name: academyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: academic_year_id
          in: query
          schema: { type: string, format: uuid }
        - name: phase
          in: query
          description: One derived phase. Archived exams are omitted unless `phase=archived`.
          schema: { $ref: "#/components/schemas/Phase" }
        - name: audience
          in: query
          schema: { type: string, enum: [level, program, groups] }
        - name: search
          in: query
          description: Case-insensitive title substring (at most 200 characters).
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 100000, default: 0 }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [total, exams, server_now]
                properties:
                  total: { type: integer }
                  server_now: { type: string, format: date-time }
                  exams:
                    type: array
                    items: { $ref: "#/components/schemas/ExamSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/exams/{examId}:
    get:
      tags: [Exams]
      summary: One exam with its parts, questions, key, timer, window, counts and corrections (staff)
      operationId: getExam
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: The exam.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Exam" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
  /api/v1/exams/{examId}/students:
    get:
      tags: [Exams]
      summary: Eligible and historical students with attempts, accepted work and result state
      operationId: listExamStudents
      parameters:
        - { $ref: "#/components/parameters/ExamId" }
      responses:
        "200":
          description: Every student, ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [total, students]
                properties:
                  total: { type: integer }
                  students:
                    type: array
                    items: { $ref: "#/components/schemas/Student" }
              examples:
                kicked:
                  summary: Third departure submitted the saved answers; written question still unmarked
                  value:
                    total: 1
                    students:
                      - annual_student_record_id: 3d1e5a4c-0000-4000-8000-000000000001
                        full_name: Amal Hassan
                        archived: false
                        group_name: Nine A
                        student_code: "0042"
                        eligible: true
                        version: 2
                        attempt: { started_at: "2026-10-14T16:05:00Z", deadline_at: "2026-10-14T17:05:00Z", departure_count: 3, answers_version: 7, last_saved_at: "2026-10-14T16:40:10Z", finalized_at: "2026-10-14T16:41:00Z", finalization_reason: kicked, superseded: false }
                        physical_draft: null
                        submission: { id: 7b0e0000-0000-4000-8000-000000000001, source: online, reason: kicked, submitted_at: "2026-10-14T16:41:00Z", processed_at: "2026-10-14T16:41:00Z", original_deadline_at: "2026-10-14T17:05:00Z", scoring_revision: 1 }
                        result: { complete: false, total: "4.00", max_score: "10.00", marked: 0, required: 1 }
                        feedback: ""
                        publication: null
                        publication_state: unpublished
                        solutions_qualified: false
                        updated_at: "2026-10-14T16:41:00Z"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
x-edra-student-operations:
  status: cookie-web-answering-integrated-source
  reason: Connected ordinary-session accounts resolve through student_caller_record. Standalone cookie web commands are implemented; attached exams are denied with content_unavailable. EDRA-234 registers fullscreen-first entry and departure handling over the EDRA-233 surface. A cookie-only teardown POST is available; no student bearer API exists. Cloud/browser release gates remain in the module README. Active question material requires a current editor claim; legacy reads expose material only after solution qualification.
  operations:
    - name: list_my_exams(academy_id, limit = 25, offset = 0)
      returns: "{total, items: [{exam_id, title, time_limit_minutes, opens_at, closes_at, actual_closes_at, phase, action}], server_now}"
      notes: The caller's discoverable exams in the academy's open year (academy_id is a locator, not authority). Discoverable means own participation (attempt, accepted submission or entered physical answers; an empty work row does not count) or an unarchived ready exam that is scheduled or open and matches the current audience. Attached, draft, unscheduled, headroom/closed-unparticipated and other-audience exams are excluded. Ordered resume/start, upcoming, then history, with id tie-breaks; limit 1..100 and offset >= 0 (validation). Read-only snapshot. Errors forbidden, validation, student_link_unavailable (unconnected, suspended, recovery/revoked session or no open-year record).
    - name: get_my_exam_overview(academy_id, exam_id)
      returns: StudentExamOverview
      notes: Same discoverability as the list, plus academy/year ownership; anything else is not_found (non-enumerating). Settles due work after authorization and returns normally so the settlement commits. Never starts an attempt or moves a deadline.
    - name: start_my_exam(academy_id, exam_id)
      returns: StudentExamState
      notes: Academy-scoped start/resume. not_found under the wrong academy. In one transaction it settles due work, locks the academic year (share) and the exam row (for update, serializing with content attachment), denies attached exams (content_unavailable) and calls the existing engine (start_exam_attempt_for). Repeats and concurrent calls return the same single attempt with its original start, deadline, answers and departure count. Errors not_open, not_eligible, source_conflict, student_link_unavailable, throttled.
    - name: get_my_exam_review(academy_id, exam_id)
      returns: StudentExamReview
      notes: EDRA-235 read-only review for the exam detail page. Same authority and discoverability as get_my_exam_overview (academy id locates; wrong academy/year, guessed, attached or undiscoverable exams are not_found; closed years resolve no record). Settles due work after authorization and returns normally; never starts an attempt, claims/renews an editor, moves a deadline or grants a retake, and needs no editor token. Before live solution qualification (edra_private.exam_solutions_available) only a status reason is returned. Answers come only from the accepted submission's frozen snapshot; the losing source is never shown. No maxima, marks, items, feedback, revisions or totals (the official total stays in the overview).
    - name: authorize_my_exam_review_images(academy_id, exam_id, image_ids)
      returns: "{status: ok, academy_id, image_ids} | {status: unavailable}"
      notes: Bounded 1..20 ids, same authority as get_my_exam_review, live solution qualification, no editor token. Only ids referenced by the review document (prompts and choices of every question including excluded ones, model answers and solution notes) are returned. The cookie signStudentExamReviewImages action signs those private paths server-side for 60 seconds; quota bucket op:exam_image. Active answering and staff image paths keep their own guards.
    - name: get_my_exam(exam_id)
      returns: StudentExamState
      notes: Settles due work first. Legacy unfenced projection returns material only once solutions qualify, never during active answering. Since EDRA-235 the qualified projection omits question max_score and departure details, and attempt.answers are the accepted online submission's frozen answers (empty when paper work was accepted).
    - name: start_exam_attempt(exam_id)
      returns: StudentExamState
      notes: Creates the single attempt (deadline_at = started_at + time limit) or resumes it with the same started_at, deadline_at, answers and departure_count; never a retake. Takes the same serialized standalone guard as start_my_exam. Errors not_open (outside opens_at..closes_at, not ready or archived), not_eligible, content_unavailable.
    - name: enter_my_exam(academy_id, exam_id, token)
      returns: "{attempt, active, editor: {status: claimed, token, generation, expires_at, heartbeat_seconds, lease_seconds} | {status: busy, retry_after} | null}"
      notes: Atomic start/resume and claim. No material in the response. Reuses the original attempt/deadline/departure count. Same-token recovery requires the browser's exclusive Web Lock; unsupported browsers do not reuse tokens. A busy second editor cannot take over. A lost initial acknowledgment without a token waits for lease expiry.
    - name: claim_my_exam_editor(academy_id, exam_id, token)
      returns: "{status: claimed | busy | finalized, ...claim_or_terminal}"
      notes: No new attempt. Lease 45 seconds, heartbeat 10 seconds, server time. Expired claims acquire a fresh random token/increased generation only if no other live editor exists.
    - name: renew_my_exam_editor(academy_id, exam_id, token)
      returns: "{status: renewed, expires_at, state: brief} | {status: lost, reason: expired | replaced} | {status: finalized, state: terminal}"
      notes: Exact live token required; an expired/superseded generation cannot be renewed. Brief contains server_now, attempt metadata and excluded_question_ids, never material.
    - name: release_my_exam_editor(academy_id, exam_id, token)
      returns: "{status: released | lost | finalized, ...}"
      notes: Conditional release only. No history deletion or deadline change.
    - name: get_my_exam_answering(academy_id, exam_id, token)
      returns: "{status: state, state: answering} | {status: lost, reason} | {status: finalized, state: terminal}"
      notes: Current editor only. Answering contains verified account_id, server_now, attempt identity/version/cutoff/departures, ordered parts/questions/choices, exclusions and own saved answers. No keys, solutions, private marks or staff flags. Terminal contains verified account_id for account-scoped journal cleanup, attempt metadata and accepted submission status only.
    - name: save_my_exam_answers(academy_id, exam_id, token, expected_version, answers, key, generation)
      returns: "{outcome: saved | conflict | finalized | editor_lost, ...}"
      notes: Patch of 1..300 distinct questions, text at most 10000 characters. Key/body/version/original generation are immutable on retries. Fresh writes require a live token and matching original generation. Accepted receipts replay metadata without writing; fresh authorized state is returned separately. Old receipts must never replace newer acknowledged answers. Lost-editor replay exposes no questions/answers. Unknown outcomes retry the same command; definitive rejection is reconciled against current acknowledged baselines before a new command is created.
    - name: submit_my_exam(academy_id, exam_id, token, expected_version, key, generation)
      returns: "{outcome: submitted | finalized | source_conflict | conflict | editor_lost, ...}"
      notes: Submits saved work only, requiring the acknowledged answers version and live original generation for a new command. Cookie UI freezes and durably flushes pending answers first. Exact retries replay; timer/closure/kick/physical confirmation retain their winning reason/source. Terminal responses contain no question material.
    - name: record_my_exam_departure(academy_id, exam_id, token, event_id, question_id, generation)
      returns: "{outcome: warned | kicked | duplicate | finalized | editor_lost, departure, state}"
      notes: EDRA-234 correlates signals to one stable event id. Entry redelivers any journaled event with its original token/generation before claiming a replacement; delivery does not wait for save retries. The current or expired latest generation may deliver a delayed event; a replaced generation cannot create an event or claim. Ordinary session/academy authority remains required. Exact event replay uses the original nullable question; a changed context including null-to-present is idempotency_conflict. Null context continues at the first non-excluded question. First two warnings advance to next non-excluded question, null after the last. Third submits saved work as kicked. Deadline wins ties. Brief live state or terminal status only.
    - name: authorize_my_exam_images(academy_id, exam_id, token, image_ids)
      returns: "{status: ok, academy_id, image_ids} | {status: lost | finalized}"
      notes: Bounded 1..20 ids, active attempt/live claim/current audience/ordinary-session authority. Only ids referenced in non-excluded prompt/choice tokens are returned. The cookie signStudentExamImages action signs those private paths server-side for 60 seconds. No direct student Storage grants, uploads or solution-media access. URLs are memory-only and retain bounded residual validity after finalization.
  teardown_http:
    method: POST
    path: /api/student/exams/{examId}/departure
    authentication: Ordinary cookie session only; bearer or mixed authority is rejected.
    request: "Strict JSON {academyId: uuid, token: 64 lowercase hex, generation: positive int32, eventId: uuid, questionId: uuid | null}; at most 2048 bytes."
    origin: Exact configured student Origin required; cross-site Fetch Metadata rejected. No CORS grants.
    response: "Private/no-store {ok: true, kind, departure} receipt only; no live/terminal state, question material, answers or results."
    errors: "400 invalid body/domain refusal; 403 origin or ordinary-session refusal; 413 body too large."
    delivery: Keepalive enqueue is not acknowledgment. Exact event/context/generation is replayed through record_my_exam_departure before replacement claims.
  retired_student_mutations:
    - save_exam_answers(exam_id, expected_version, answers, key)
    - submit_exam_attempt(exam_id, key)
    - record_exam_departure(exam_id, event_id, question_id)
  compatibility: Authenticated execution of the unfenced mutation signatures is revoked. Private record-based staff and worker engines remain available. Legacy get_my_exam/start_exam_attempt/start_my_exam expose question material and the accepted online answers only after solution qualification (no maxima or departures); active clients must use fenced commands and review clients get_my_exam_review.
components:
  securitySchemes:
    staffToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The Supabase Auth access token of a signed-in staff member.
  parameters:
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error with a stable code (see sessions-attendance.openapi.yaml for the shape).
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, request_id]
                properties:
                  code: { type: string, enum: [INVALID_REQUEST, AMBIGUOUS_AUTHENTICATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, THROTTLED, INTERNAL] }
                  message: { type: string }
                  request_id: { type: string }
  schemas:
    Phase:
      type: string
      description: Derived from readiness (including the timer), window and archive. headroom is between the scheduled close and actual closure.
      enum: [preparing, ready, scheduled, open, headroom, closed, archived]
    Reason:
      type: string
      description: kicked is the third departure; it is an explanatory flag on ordinary accepted work.
      enum: [submitted, timer, kicked, window_closed, physical]
    Decimal:
      type: string
      pattern: "^\\d{1,5}(\\.\\d{1,2})?$"
    Departure:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        ordinal: { type: integer, minimum: 1, maximum: 3 }
        question_id: { type: [string, "null"], format: uuid }
        question_number: { type: [integer, "null"], description: Original exam-wide number; both context fields are null only before any question was displayed. }
        outcome: { type: string, enum: [warned, kicked] }
        next_question_id: { type: [string, "null"], format: uuid, description: Where a warned student continues; null after the last non-excluded question and when kicked. }
        recorded_at: { type: string, format: date-time }
    ExamSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        title: { type: string }
        audience: { type: [string, "null"], enum: [level, program, groups, null] }
        level_id: { type: [string, "null"] }
        track_id: { type: [string, "null"], format: uuid }
        group_ids: { type: array, items: { type: string, format: uuid } }
        time_limit_minutes: { type: [integer, "null"], description: Null only while preparation is incomplete. }
        opens_at: { type: [string, "null"], format: date-time }
        closes_at: { type: [string, "null"], format: date-time }
        actual_closes_at: { type: [string, "null"], format: date-time }
        max_score: { $ref: "#/components/schemas/Decimal" }
        effective_max_score: { $ref: "#/components/schemas/Decimal" }
        question_count: { type: integer }
        phase: { $ref: "#/components/schemas/Phase" }
        updated_at: { type: string, format: date-time }
        submitted: { type: integer }
        in_progress: { type: integer }
        announced: { type: integer }
        processing_pending:
          type: boolean
          description: >-
            Due work (an attempt past its cutoff, or actual closure not yet settled) has not been processed.
            The list is a read-only snapshot and never settles; `GET /exams/{examId}` and staff commands
            settle it, and the deadline worker does so within about a minute. `phase` is derived from time
            and stays `closed` regardless; this flag is the separate processing fact.
        closure_settled_at: { type: [string, "null"], format: date-time }
    Exam:
      type: object
      description: Staff document. Includes the key (`is_correct`), model answers and solution notes.
      properties:
        id: { type: string, format: uuid }
        academy_id: { type: string, format: uuid }
        academic_year_id: { type: string, format: uuid }
        title: { type: string }
        instructions: { type: string }
        solution_notes: { type: string }
        audience: { type: [string, "null"], enum: [level, program, groups, null] }
        level_id: { type: [string, "null"] }
        track_id: { type: [string, "null"] }
        group_ids: { type: array, items: { type: string } }
        time_limit_minutes: { type: [integer, "null"], minimum: 1, maximum: 600, description: Required for readiness. }
        opens_at: { type: [string, "null"], format: date-time }
        closes_at: { type: [string, "null"], format: date-time }
        actual_closes_at: { type: [string, "null"], format: date-time }
        max_score: { $ref: "#/components/schemas/Decimal" }
        effective_max_score: { $ref: "#/components/schemas/Decimal" }
        question_count: { type: integer }
        version: { type: integer }
        scoring_revision: { type: integer, description: Incremented by each key correction or exclusion. }
        work_started_at: { type: [string, "null"], description: Audience and timer are locked from here. }
        structure_locked_at: { type: [string, "null"], description: Parts, questions, choices, maxima and key are locked from here. }
        closure_settled_at: { type: [string, "null"] }
        processing_pending: { type: boolean, description: Always false after this read, which settles due work first. }
        year_open: { type: boolean }
        ready: { type: boolean }
        issues:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [exam, part, question] }
              id: { type: string, format: uuid }
              issue: { type: string, enum: [target, timer, parts, questions, choices, correct_choice, choice_text] }
        phase: { $ref: "#/components/schemas/Phase" }
        server_now: { type: string, format: date-time }
        fully_automatic: { type: boolean }
        counts: { type: object }
        corrections: { type: array, items: { type: object } }
        parts: { type: array, items: { type: object }, description: Questions carry `number`, their original exam-wide number, kept after exclusion. }
    Student:
      type: object
      properties:
        annual_student_record_id: { type: string, format: uuid }
        full_name: { type: string }
        eligible: { type: boolean, description: Currently matches the target. Historical participants may not. }
        version: { type: integer }
        attempt:
          type: [object, "null"]
          properties:
            deadline_at: { type: string, format: date-time, description: Original individual deadline. }
            departure_count: { type: integer, minimum: 0, maximum: 3 }
        physical_draft: { type: [object, "null"] }
        submission:
          type: [object, "null"]
          properties:
            source: { type: string, enum: [online, physical] }
            reason: { $ref: "#/components/schemas/Reason" }
            submitted_at: { type: string, format: date-time }
            processed_at: { type: string, format: date-time }
        result:
          type: [object, "null"]
          description: Private current result. complete is false while a non-excluded Written Work question is unmarked.
        publication: { type: [object, "null"], description: Latest official revision. }
        publication_state: { type: string, enum: [unpublished, published, pending_correction] }
        solutions_qualified: { type: boolean }
    StudentExamResult:
      type: [object, "null"]
      description: Current official result, total only; no per-part/per-question items, feedback or private marks. A revision above 1 is an officially announced correction.
      properties:
        total: { type: string, description: Exact decimal. }
        max_score: { type: string }
        published_at: { type: string, format: date-time, description: First official announcement. }
        corrected: { type: boolean }
        corrected_at: { type: [string, "null"], format: date-time, description: Announcement of the current corrected total. }
    StudentExamOverview:
      type: object
      description: Allowlisted overview (EDRA-232); no questions, answers, departure questions, result items or feedback.
      properties:
        exam_id: { type: string, format: uuid }
        title: { type: string }
        instructions: { type: string }
        time_limit_minutes: { type: [integer, "null"] }
        opens_at: { type: [string, "null"] }
        closes_at: { type: [string, "null"], description: Scheduled close; no new starts from here. }
        actual_closes_at: { type: [string, "null"], description: Scheduled close plus the two-minute completion period. }
        server_now: { type: string, format: date-time }
        phase: { $ref: "#/components/schemas/Phase" }
        action: { type: string, enum: [start, resume, submitted, not_yet_open, no_new_starts, ineligible, unavailable], description: Server-derived entry state; browser capability and integration readiness are further client restrictions, never authorization. }
        attempt:
          type: [object, "null"]
          properties:
            started_at: { type: string }
            deadline_at: { type: string }
            cutoff_at: { type: string }
            departure_count: { type: integer }
            finalized_at: { type: [string, "null"] }
            finalization_reason: { oneOf: [{ $ref: "#/components/schemas/Reason" }, { type: "null" }] }
            superseded: { type: boolean }
        submission:
          type: [object, "null"]
          properties:
            source: { type: string, enum: [online, physical] }
            reason: { $ref: "#/components/schemas/Reason" }
            submitted_at: { type: string }
            processed_at: { type: string }
        result: { $ref: "#/components/schemas/StudentExamResult" }
    StudentExamReview:
      description: |
        Read-only review (EDRA-235). `unavailable.reason` is not_submitted (no accepted submission),
        awaiting_closure (before actual closure) or awaiting_result (accepted paper work closed without
        an announced result). `available` is returned only once solutions qualify: online accepted work at
        actual closure; paper work at actual closure plus an announced result, in either order.
      oneOf:
        - type: object
          required: [status, account_id, server_now, reason]
          properties:
            status: { const: unavailable }
            account_id: { type: string, format: uuid }
            server_now: { type: string, format: date-time }
            reason: { type: string, enum: [not_submitted, awaiting_closure, awaiting_result] }
        - type: object
          required: [status, account_id, server_now, source, notes, parts]
          properties:
            status: { const: available }
            account_id: { type: string, format: uuid }
            server_now: { type: string, format: date-time }
            source: { type: string, enum: [online, physical] }
            notes: { type: string, description: Released solution notes (may contain image tokens). }
            parts:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  instructions: { type: string }
                  kind: { type: string, enum: [question_sheet, written_work] }
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        number: { type: integer, description: Original exam-wide number; exclusions never renumber. }
                        prompt: { type: string }
                        excluded: { type: boolean }
                        choices: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, label: { type: string } } } }
                        answer:
                          description: Frozen in the accepted submission. paper_work is untranscribed paper Written Work, not a blank response.
                          oneOf:
                            - { type: object, properties: { state: { const: choice }, choice_id: { type: string, format: uuid } } }
                            - { type: object, properties: { state: { const: text }, text: { type: string } } }
                            - { type: object, properties: { state: { const: blank } } }
                            - { type: object, properties: { state: { const: paper_work } } }
                        correct_choice_id: { type: [string, "null"], format: uuid, description: The current released key. }
                        model_answer: { type: string }
    StudentExamState:
      type: object
      description: |
        Student-safe projection (EDRA-83 handoff; not exposed over HTTP yet), built field by field.
        Never contains the key, model answers, solution notes or private marks before `solutions` is
        present, and no score before `result` (an announced revision) exists. After final submission
        and before solutions qualify, parts, excluded_question_ids, attempt.answers and
        attempt.departures are empty (no question/answer review).
      properties:
        exam_id: { type: string, format: uuid }
        server_now: { type: string, format: date-time }
        opens_at: { type: [string, "null"] }
        closes_at: { type: [string, "null"] }
        actual_closes_at: { type: [string, "null"] }
        time_limit_minutes: { type: integer }
        phase: { $ref: "#/components/schemas/Phase" }
        eligible: { type: boolean }
        excluded_question_ids: { type: array, items: { type: string }, description: Empty until question material is permitted; then skip these when navigating; they cannot be answered. }
        parts: { type: array, items: { type: object }, description: Present only once solutions qualify on legacy public reads; the fenced answering read separately exposes the active editor's questions; then stable order with original question numbers and choices without correctness. Physical drafts/submissions alone do not reveal material. }
        attempt:
          type: [object, "null"]
          properties:
            started_at: { type: string }
            deadline_at: { type: string, description: Original timer deadline; never changes. }
            cutoff_at: { type: string, description: Earlier of deadline_at and actual_closes_at. }
            answers_version: { type: integer }
            departure_count: { type: integer }
            departures: { type: array, items: { $ref: "#/components/schemas/Departure" }, description: Empty unless question material is permitted. }
            finalized_at: { type: [string, "null"] }
            finalization_reason: { oneOf: [{ $ref: "#/components/schemas/Reason" }, { type: "null" }] }
            superseded: { type: boolean, description: Physical work was accepted first. }
            answers: { type: array, items: { type: object }, description: Empty unless question material is permitted. }
        submission:
          type: [object, "null"]
          description: Finalization acknowledgment.
          properties:
            source: { type: string, enum: [online, physical] }
            reason: { $ref: "#/components/schemas/Reason" }
            submitted_at: { type: string, description: Effective submission time (the cutoff for deadline submissions). }
            processed_at: { type: string, description: When the database settled it; may be later than submitted_at. }
            original_deadline_at: { type: [string, "null"] }
        result: { $ref: "#/components/schemas/StudentExamResult" }
        solutions: { type: [object, "null"], description: Present once qualified (online at actual closure, including timer/kicked/window_closed; physical at closure plus announcement). Key, model answers and notes only; no video access. }
      examples:
        - summary: Second departure on the last question (warned, no later question)
          phase: open
          time_limit_minutes: 60
          attempt: { started_at: "2026-10-14T16:00:00Z", deadline_at: "2026-10-14T17:00:00Z", cutoff_at: "2026-10-14T17:00:00Z", departure_count: 2, finalized_at: null, finalization_reason: null, superseded: false }
          submission: null
          result: null
          solutions: null
        - summary: Timer tie at actual closure (deadline equals actual closure, so reason timer)
          phase: closed
          attempt: { started_at: "2026-10-14T16:02:00Z", deadline_at: "2026-10-14T17:02:00Z", cutoff_at: "2026-10-14T17:02:00Z", finalized_at: "2026-10-14T17:02:00Z", finalization_reason: timer, superseded: false }
          submission: { source: online, reason: timer, submitted_at: "2026-10-14T17:02:00Z", processed_at: "2026-10-14T17:02:20Z" }
