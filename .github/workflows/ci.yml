name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
          if-no-files-found: ignore

  database:
    runs-on: ubuntu-latest
    # Each run builds its own disposable Supabase database on this runner from the checkout's
    # migrations, so no cloud credentials or shared-target serialization are needed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/db-ci.sh
        env:
          EDRA_DB_TYPES_OUTPUT: ${{ runner.temp }}/edra-database.types.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-types
          path: ${{ runner.temp }}/edra-database.types.ts
          if-no-files-found: ignore

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge static checks
        run: bash scripts/edge-check.sh
      - name: Edge Deno runtime tests
        run: bash scripts/edge-test.sh

  attendance-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each job owns its stack. No cancel-in-progress: teardown gets a chance to finish.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/attendance-e2e-ci.sh
      - name: Cleanup this run's attendance infrastructure
        if: always()
        run: bash scripts/attendance-e2e-ci.sh --cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attendance-e2e
          path: |
            web/playwright-report/attendance
            web/test-results/attendance
            web/artifacts/attendance/phases.log
          retention-days: 7
          if-no-files-found: ignore
