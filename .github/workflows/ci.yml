name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  database:
    runs-on: ubuntu-latest
    # Each run builds its own disposable Supabase database on this runner from the checkout's
    # migrations, so no cloud credentials or shared-target serialization are needed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: bash scripts/db-ci.sh
        env:
          EDRA_DB_TYPES_OUTPUT: ${{ runner.temp }}/edra-database.types.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-types
          path: ${{ runner.temp }}/edra-database.types.ts
          if-no-files-found: ignore

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/edge-check.sh
