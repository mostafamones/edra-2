name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

  database:
    runs-on: ubuntu-latest
    # The marked cloud test project has fixed SQL fixture IDs and must have one runner at a time.
    concurrency:
      group: edra-cloud-database-tests
      cancel-in-progress: false
    env:
      EDRA_DB_TEST_URL: ${{ secrets.EDRA_DB_TEST_URL }}
      EDRA_DB_TEST_TARGET: ${{ vars.EDRA_DB_TEST_TARGET }}
      NEXT_PUBLIC_SUPABASE_URL: https://fgbcjlibwgxylfwmocgx.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # The isolated cloud project must already have the repository migrations applied.
      # The runner validates its marker and migration history; it never resets or migrates it.
      - run: npm run test:db -- --check
      - run: npm run test:db

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: bash scripts/edge-check.sh
